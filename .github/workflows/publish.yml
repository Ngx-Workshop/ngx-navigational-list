name: Publish ngx-navigational-list

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngx-navigational-list-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          check-latest: true
          package-manager-cache: false

      - name: Install publishing CLI
        run: |
          node - <<'NODE'
          const [major, minor, patch] = process.versions.node.split('.').map(Number);
          if (major !== 22 || minor < 22 || (minor === 22 && patch < 2)) {
            throw new Error('npm 12.1.0 requires Node 22.22.2 or newer on Node 22');
          }
          NODE
          npm install --global npm@12.1.0

      - name: Install dependencies
        run: npm ci

      - name: Set deterministic library version
        working-directory: projects/ngx-navigational-list
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = './package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (pkg.name !== '@tmdjr/ngx-navigational-list') {
            throw new Error('Unexpected library package');
          }

          const [major, minor] = String(pkg.version).split('.');
          const patch = process.env.GITHUB_RUN_NUMBER;
          if (!/^\d+$/.test(patch || '')) {
            throw new Error('Missing valid GitHub run number');
          }

          pkg.version = `${major}.${minor}.${patch}`;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          console.log('Publishing', pkg.name, pkg.version);
          NODE

      - name: Build Angular library
        run: npm run ngx-navigational-list:build

      - name: Publish library using OIDC
        working-directory: dist/ngx-navigational-list
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm publish --access public
